services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT-SECRET: ${JWT_SECRET}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NODE_ENV: production
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
  frontend:
    build: ./client
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  uploads_data:
